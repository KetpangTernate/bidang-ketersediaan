```html
<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Ketahanan Pangan</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    body{
      font-family:'Poppins',sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar{
      display:none;
    }

    .no-scrollbar{
      -ms-overflow-style:none;
      scrollbar-width:none;
    }

    .dashboard-frame{
      width:100%;
      height:2200px;
      border:none;
    }

    @media(max-width:768px){

      .dashboard-frame{
        height:1800px;
      }

    }

    .tab-active{
      background:#16a34a;
      color:white;
    }

    .tab-inactive{
      background:#f3f4f6;
      color:#374151;
    }

  </style>

</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="fixed top-0 left-0 w-full bg-white shadow-md z-50">

    <div class="max-w-7xl mx-auto px-4 py-3">

      <div class="flex items-center gap-3">

        <img
          src="assets/img/logo.png"
          alt="Logo"
          class="w-12 h-12 object-contain">

        <h1 class="text-xl md:text-3xl font-bold text-green-700">
          Panel Informasi Binketra
        </h1>

      </div>

      <div class="flex gap-3 overflow-x-auto no-scrollbar mt-4">

        <a href="index.html"
          class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
          Beranda
        </a>

        <a href="dashboard.html"
          class="whitespace-nowrap bg-green-600 text-white px-5 py-3 rounded-2xl text-sm font-semibold shadow-sm">
          Dashboard
        </a>

        <a href="ketersediaan.html"
          class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
          Ketersediaan
        </a>

        <a href="kerawanan.html"
          class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
          Kerawanan
        </a>

      </div>

    </div>

  </nav>

  <!-- CONTENT -->
  <main class="pt-40 pb-10 px-4 max-w-7xl mx-auto">

    <div class="mb-8">

      <h2 class="text-3xl md:text-4xl font-bold text-gray-800">
        Dashboard Neraca dan Ketahanan Pangan
      </h2>

      <p class="text-gray-500 mt-2">
        Monitoring ketersediaan, kebutuhan, stok dan ketahanan pangan Kota Ternate
      </p>

    </div>

    <!-- TAB DASHBOARD -->
    <div class="flex flex-wrap gap-3 mb-4">

      <button
        id="btnRingkasan"
        onclick="showRingkasan()"
        class="tab-active px-6 py-3 rounded-2xl font-semibold transition">

        Ringkasan Stok Pangan

      </button>

      <button
        id="btnAnalisis"
        onclick="showAnalisis()"
        class="tab-inactive px-6 py-3 rounded-2xl font-semibold transition">

        Analisis Per Komoditas

      </button>

    </div>

    <!-- TOMBOL FULLSCREEN -->
    <div class="mb-6">

      <a
        id="btnFullscreen"
        href="https://datastudio.google.com/embed/reporting/9a1d3f3e-fc8d-46ee-b3cd-b125940086cc/page/aLkzF"
        target="_blank"
        class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-semibold shadow-md transition">

        🔍 Buka Dashboard Layar Penuh

      </a>

    </div>

    <!-- DASHBOARD -->
    <div class="bg-white rounded-3xl shadow-md overflow-hidden p-2">

      <iframe
        id="dashboardFrame"
        class="dashboard-frame"
        src="https://datastudio.google.com/embed/reporting/9a1d3f3e-fc8d-46ee-b3cd-b125940086cc/page/aLkzF"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-green-700 text-white py-6 mt-10">

    <div class="max-w-7xl mx-auto px-4 text-center">

      <p class="text-sm">
        © 2026 Dinas Ketahanan Pangan Kota Ternate
      </p>

    </div>

  </footer>

  <script>

    const frame = document.getElementById("dashboardFrame");
    const btnFullscreen = document.getElementById("btnFullscreen");

    function showRingkasan(){

      const url =
      "https://datastudio.google.com/embed/reporting/9a1d3f3e-fc8d-46ee-b3cd-b125940086cc/page/aLkzF";

      frame.src = url;
      btnFullscreen.href = url;

      document.getElementById("btnRingkasan").className =
      "tab-active px-6 py-3 rounded-2xl font-semibold transition";

      document.getElementById("btnAnalisis").className =
      "tab-inactive px-6 py-3 rounded-2xl font-semibold transition";

    }

    function showAnalisis(){

      const url =
      "https://datastudio.google.com/embed/reporting/f0c19ad6-4d03-4e1f-99b2-32eb4022fd7e/page/aLkzF";

      frame.src = url;
      btnFullscreen.href = url;

      document.getElementById("btnAnalisis").className =
      "tab-active px-6 py-3 rounded-2xl font-semibold transition";

      document.getElementById("btnRingkasan").className =
      "tab-inactive px-6 py-3 rounded-2xl font-semibold transition";

    }

  </script>

</body>
</html>
