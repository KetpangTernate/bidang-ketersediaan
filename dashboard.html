<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Ketahanan Pangan</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
}

.no-scrollbar::-webkit-scrollbar{
    display:none;
}

.no-scrollbar{
    -ms-overflow-style:none;
    scrollbar-width:none;
}

/* Container Dashboard */

.dashboard-container{
    display:flex;
    justify-content:center;
    width:100%;
}

/* Desktop */

.dashboard-frame{
    width:507px;
    height:2000px;
    border:none;
    display:block;
    margin:0 auto;
}

/* HP */

@media(max-width:768px){

    .dashboard-frame{
        width:100vw;
        height:2200px;
        margin:0;
    }

}

</style>

</head>

<body class="bg-gray-100">

<!-- NAVBAR -->

<nav class="fixed top-0 left-0 w-full bg-white shadow-md z-50">

    <div class="max-w-7xl mx-auto px-4 py-3">

        <div class="flex items-center gap-3">

            <img
                src="assets/img/logo.png"
                alt="Logo"
                class="w-12 h-12 object-contain">

            <h1 class="text-xl md:text-3xl font-bold text-green-700">
                Panel Informasi Binketra
            </h1>

        </div>

        <div class="flex gap-3 overflow-x-auto no-scrollbar mt-4">

            <a href="index.html"
                class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
                Beranda
            </a>

            <a href="dashboard.html"
                class="whitespace-nowrap bg-green-600 text-white px-5 py-3 rounded-2xl text-sm font-semibold shadow-sm">
                Dashboard
            </a>

            <a href="ketersediaan.html"
                class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
                Ketersediaan
            </a>

            <a href="kerawanan.html"
                class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">
                Kerawanan
            </a>

        </div>

    </div>

</nav>

<!-- DASHBOARD -->

<main class="pt-40 pb-6">

    <div class="dashboard-container">

        <iframe
        class="dashboard-frame"
        src="https://datastudio.google.com/embed/reporting/35200f89-1e58-4f41-849f-a77bc72dc98b/page/zDtzF?v=2"
        frameborder="0"
        allowfullscreen>
        </iframe>

    </div>

</main>

<!-- FOOTER -->

<footer class="bg-green-700 text-white py-6">

    <div class="max-w-7xl mx-auto px-4 text-center">

        <p class="text-sm">
            © 2026 Dinas Ketahanan Pangan Kota Ternate
        </p>

    </div>

</footer>

</body>
</html>
