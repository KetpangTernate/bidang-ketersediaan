<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Ketahanan Pangan Kota Ternate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f3f4f6;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    text-align:center;
    width:90%;
    max-width:500px;
}

.logo{
    width:80px;
    margin-bottom:20px;
}

h1{
    color:#15803d;
    font-size:28px;
    margin-bottom:10px;
}

p{
    color:#6b7280;
    margin-bottom:25px;
}

.loader{
    width:50px;
    height:50px;
    border:5px solid #e5e7eb;
    border-top:5px solid #16a34a;
    border-radius:50%;
    margin:0 auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>Panel Informasi Binketra</h1>

    <p>
        Membuka Dashboard Ketahanan Pangan Kota Ternate...
    </p>

    <div class="loader"></div>

</div>

<script>

/* Dashboard HP */

const dashboardHP =
"https://datastudio.google.com/embed/reporting/35200f89-1e58-4f41-849f-a77bc72dc98b/page/zDtzF";

/* Dashboard Desktop */

const dashboardDesktop =
"https://datastudio.google.com/embed/reporting/5229fb2e-2115-43c9-8169-56ff98478d19/page/zDtzF";

/* Deteksi perangkat */

if(window.innerWidth <= 768){

    window.location.replace(dashboardHP);

}else{

    window.location.replace(dashboardDesktop);

}

</script>

</body>

</html>
