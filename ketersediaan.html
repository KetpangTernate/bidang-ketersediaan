<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ketersediaan Pangan</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    body {
      font-family: 'Poppins', sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

  </style>

</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="fixed top-0 left-0 w-full bg-white shadow-md z-50">

    <div class="max-w-7xl mx-auto px-4 py-3">

      <!-- LOGO -->
      <div class="flex items-center gap-3">

        <img 
          src="assets/img/logo.png"
          alt="Logo"
          class="w-12 h-12 object-contain"
        >

        <h1 class="text-xl md:text-3xl font-bold text-green-700">
          Panel Informasi Binketra
        </h1>

      </div>

      <!-- MENU -->
      <div class="flex gap-3 overflow-x-auto no-scrollbar mt-4">

        <a href="index.html"
          class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">

          Beranda

        </a>

        <a href="dashboard.html"
           target="_blank"
            rel="noopener noreferrer"
            class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">

            Dashboard

        </a>

        </a>

        <a href="ketersediaan.html"
          class="whitespace-nowrap bg-green-600 text-white px-5 py-3 rounded-2xl text-sm font-semibold shadow-sm">

          Ketersediaan

        </a>

        <a href="kerawanan.html"
          class="whitespace-nowrap bg-gray-100 hover:bg-green-100 text-gray-700 px-5 py-3 rounded-2xl text-sm font-medium transition">

          Kerawanan

        </a>

      </div>

    </div>

  </nav>

  <!-- CONTENT -->
  <main class="pt-40 pb-10 px-4 max-w-7xl mx-auto">

    <!-- HEADER -->
    <div class="mb-10">

      <h2 class="text-3xl md:text-4xl font-bold text-gray-800">

        Ketersediaan Pangan

      </h2>

      <p class="text-gray-500 mt-2">

        Monitoring ketahanan stok pangan Kota Ternate

      </p>

    </div>

    <!-- GRID CARD -->
    <div 
      id="komoditas-container"
      class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-green-700 text-white py-6 mt-10">

    <div class="max-w-7xl mx-auto px-4 text-center">

      <p class="text-sm">

        © 2026 Dinas Ketahanan Pangan Kota Ternate

      </p>

    </div>

  </footer>

  <!-- SCRIPT -->
  <script>

    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3CDWIUZdyBNql3fDKgRAUrWP5tJ2mm5AB8ZajZFdH7WcgISEyNCNLWmctCW1qug-R7_XpxwyVDDS1/pub?gid=0&single=true&output=csv";

    async function loadKomoditas() {

      const response = await fetch(sheetURL);
      const data = await response.text();

      const rows = data.split("\n").slice(1);

      const container = document.getElementById("komoditas-container");

      rows.forEach(row => {

        if(row.trim() === "") return;

        const cols = row.split(",");

        const komoditas = cols[0];
        const neraca = cols[1];
        const ketersediaan = cols[2];
        const kebutuhan = cols[3];
        const hari = cols[4];
        const gambar = cols[5];
        const status = cols[6];

        let warna = "bg-green-500";

        if(status.trim() == "kuning") {
          warna = "bg-yellow-400";
        }

        if(status.trim() == "merah") {
          warna = "bg-red-500";
        }

        const card = `
        
        <div class="relative rounded-3xl overflow-hidden shadow-lg border-4 border-green-700 min-h-[320px]">

          <!-- IMAGE -->
          <img 
            src="assets/img/komoditas/${gambar}"
            class="absolute inset-0 w-full h-full object-cover"
          >

          <!-- OVERLAY -->
          <div class="absolute inset-0 bg-white/80"></div>

          <!-- CONTENT -->
          <div class="relative p-6">

            <h3 class="text-3xl font-bold text-green-800 mb-4">

              ${komoditas}

            </h3>

            <div class="space-y-2 text-gray-800 font-medium text-lg">

              <p>
                Neraca ${neraca} Ton
              </p>

              <p>
                Ketersediaan ${ketersediaan} Ton
              </p>

              <p>
                Kebutuhan ${kebutuhan} Ton
              </p>

            </div>

            <div class="mt-5 flex items-center gap-2">

  <p class="font-semibold text-gray-800">
    Ketahanan Stok
  </p>

  <span class="${warna} text-white px-4 py-2 rounded-full text-sm font-bold shadow">

    ${hari} Hari

  </span>

</div>

          </div>

        </div>

        `;

        container.innerHTML += card;

      });

    }

    loadKomoditas();

  </script>

</body>
</html>
